# Общий стенд: backend + frontend.
# Инфраструктура (postgres, rabbitmq, victoria-metrics, victoria-logs) поднимается
# отдельно из docker-compose-services.yml — в той же docker-сети/на той же машине.
# Агент на этом стенде НЕ поднимается: ему нужен docker-сокет хоста,
# поэтому агент ставится отдельно на каждый сервер
# (см. docker-compose-services-agent.yml и dockrunner_agent/DEPLOY.md).
#
# Запуск:
#   cp .env.example .env        # заполнить секреты
#   docker compose up -d --build
#
# Пересборка фронта с другим API: поменять VITE_API_URL в .env и:
#   docker compose up -d --build frontend

services:
  backend:
    build: ./dockrunner_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env

  frontend:
    build:
      context: ./dockrunner
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_VICTORIA_LOGS_URL: ${VITE_VICTORIA_LOGS_URL:-http://localhost:9428}
        VITE_VICTORIA_METRICS_URL: ${VITE_VICTORIA_METRICS_URL:-http://localhost:8428}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
