# Общий стенд: postgres + rabbitmq + influxdb + backend + frontend.
# Агент на этом стенде НЕ поднимается: ему нужен docker-сокет хоста,
# поэтому агент ставится отдельно на каждый сервер (см. dockrunner_agent/DEPLOY.md).
#
# Запуск: docker compose up -d --build
# Пересборка фронта с другим API: VITE_API_URL=https://api.example.com docker compose up -d --build frontend

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dockrunner
      POSTGRES_PASSWORD: dockrunner
      POSTGRES_DB: dockrunner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockrunner"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: dockrunner
      RABBITMQ_DEFAULT_PASS: dockrunner
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  influxdb:
    image: influxdb:2
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: dockrunner
      DOCKER_INFLUXDB_INIT_PASSWORD: dockrunner-influx-pass
      DOCKER_INFLUXDB_INIT_ORG: dockrunner
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dockrunner-influx-token
    volumes:
      - influxdata:/var/lib/influxdb2

  backend:
    build: ./dockrunner_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      PORT: 8080
      POSTGRES_URL: postgres://dockrunner:dockrunner@postgres:5432/dockrunner?sslmode=disable
      RABBITMQ_URL: amqp://dockrunner:dockrunner@rabbitmq:5672/
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: dockrunner-influx-token
      INFLUX_ORG: dockrunner
      INFLUX_BUCKET: metrics
      JWT_SECRET: change-me-super-secret-key-32-chars-min-32
      AGENT_TOKEN: change-me-agent-shared-secret
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: admin123
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:5173
      PORTS_MIN: 3000
      PORTS_MAX: 4000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./dockrunner
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  rabbitdata:
  influxdata:
